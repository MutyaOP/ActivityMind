; Скопируйте этот файл в config.ini и впишите токен устройства
; (сайт ActivityMind → «Устройства» → «Создать и получить токен»).

[server]
url = http://localhost:8000
token =

[tracking]
; как часто проверять активное окно, секунд
poll_interval_sec = 5
; после скольких секунд без мыши/клавиатуры считать «простоем»
idle_threshold_sec = 300
; сессии короче этого значения не записываются
min_session_sec = 3
; длинные сессии режутся на части (секунд)
max_session_sec = 3600
; ПРИВАТНОСТЬ: отправлять ли заголовки окон (могут содержать личное). По умолчанию — нет
track_window_titles = false
; приложения, которые не записываются вообще (через запятую, без .exe)
ignore_apps = KeePass, 1Password, Bitwarden

[sync]
; как часто отправлять накопленное на сайт, секунд
interval_sec = 60
batch_size = 200
timeout_sec = 10
